<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly plan</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--muted:#8b98a5;
--accent:#facc15;--ok:#22c55e;--warn:#facc15;--er:#ef4444;--blue:#60a5fa;
--old:#ef4444;--newp:#ef4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif}
header.mo-chrome{display:flex;flex-direction:column;gap:0;padding:0;border-bottom:none;position:sticky;top:0;background:var(--bg);z-index:40}
.sim-tabs{display:flex;gap:4px;margin:0;padding:0 18px;border-bottom:1px solid var(--line);background:var(--bg)}
.sim-tab{background:none;border:none;border-bottom:3px solid transparent;color:#8b949e;font-size:14px;font-weight:600;font-family:inherit;padding:10px 20px;cursor:pointer;margin-bottom:-1px;text-decoration:none;display:inline-block;transition:all .15s ease}
.sim-tab.on{color:#f0883e;border-bottom-color:#f0883e}
.sim-tab:hover{color:var(--txt)}
.mo-navbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:7px 12px;margin:8px 18px 0;border:1px solid var(--line);border-radius:12px;background:#161b22}
.mo-navbar h1{font-size:12px;margin:0;letter-spacing:0;font-weight:700}
.mo-navbar .mo-nav-sub{font-size:10.5px;color:var(--muted)}
.mo-year-lab{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mo-year-lab input{width:88px;padding:4px 8px;font-size:13px;margin:0}
main{max-width:1320px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 10px;letter-spacing:.02em}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input[type=month],input[type=number],input[type=file]{background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px}
textarea{width:100%;min-height:74px;background:#0d1117;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12px;font-family:ui-monospace,monospace}
button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:6px 13px;font-size:12.5px;cursor:pointer}
button:hover{border-color:#8b98a5}
button.primary{background:var(--accent);color:#1a1d24;font-weight:700;border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
.kpis{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v.pred{color:#ef4444} .kpi .v.man{color:#facc15} .kpi .v.gap{color:var(--ok)}
.kpi .v.old{color:var(--old)} .kpi .v.newp{color:var(--newp)}
.chart{height:320px}
.charts2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.charts2 .chart{height:340px}
@media(max-width:900px){.charts2{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{padding:3px 9px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase}
.status{font-size:11.5px;margin-left:8px}
.status.ok{color:var(--ok)} .status.er{color:var(--er)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px}
.mcard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#0d1117;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.mcard:hover{border-color:#8b98a5}
.mcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.mcard .name{font-size:14px;font-weight:700;margin:0 0 8px}
.mcard .meta{font-size:11px;color:var(--muted);margin:0 0 8px}
.mcard .row3{display:flex;flex-direction:column;gap:5px}
.mcard .ln{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px}
.mcard .ln b{font-variant-numeric:tabular-nums;font-size:14px}
.mcard .ln.pred b{color:#ef4444} .mcard .ln.tgt b{color:#facc15}
.mcard .ln.old b{color:var(--old)} .mcard .covs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mcard .pill{font-size:10px;padding:1px 6px;border-radius:8px;background:#21262d;color:var(--muted)}
.mcard .pill.ok{color:var(--ok)} .mcard .pill.warn{color:var(--warn)} .mcard .pill.er{color:var(--er)}
.bars{display:flex;gap:6px;align-items:flex-end;height:44px;margin-top:10px}
.bars i{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.bars .p{background:#ef4444} .bars .t{background:#facc15}
.bars .o{background:#ef4444;opacity:.45}
.bars .np{background:#ef4444}
.adv>summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:4px 0}
.mat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 4px}
@media(max-width:1100px){.mat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mat-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#0d1117}
.mat-card h3{margin:0 0 4px;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mat-card .cov{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.mat-card .cov.ok{color:var(--ok)} .mat-card .cov.warn{color:var(--warn)} .mat-card .cov.er{color:var(--er)}
.mat-card .pair{display:flex;justify-content:space-between;font-size:12px;margin-top:4px}
.mat-card .pair b{font-variant-numeric:tabular-nums}
.sec-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
/* Parking panel (owner, 2026-08-28): how many DT come off LIM-LD to land
   the YEAR on 100%, per month, and how many must actually park. */
.park-box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#0d1117;margin:10px 0 4px}
.park-box h3{margin:0 0 2px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.park-box .sub{font-size:12px;color:var(--muted);margin-bottom:8px}
.park-box table{width:100%;border-collapse:collapse;font-size:12.5px}
.park-box th{text-align:right;font-weight:600;color:var(--muted);padding:4px 8px;border-bottom:1px solid var(--line)}
.park-box th:first-child{text-align:left}
.park-box td{text-align:right;padding:4px 8px;font-variant-numeric:tabular-nums}
.park-box td:first-child{text-align:left;font-weight:600}
.park-box tr.tot td{border-top:1px solid var(--line);font-weight:700}
.park-box .keep{color:var(--ok)} .park-box .park{color:var(--er);font-weight:700}
.park-box .zero{color:var(--ok);font-weight:700}
.park-box .verdict{margin-top:8px;font-size:12.5px;font-weight:600}
#mo-board-note:empty{display:none}
</style>
</head>
<body>
<header class="mo-chrome">
  <div class="sim-tabs" role="navigation" aria-label="App sections">
    <a href="/simulator?tab=sim" class="sim-tab">Capability &amp; Scenario</a>
    <a href="/simulator?tab=cong" class="sim-tab">🔬 Congestion Model</a>
    <a href="/simulator?tab=plan" class="sim-tab">🧭 Plan</a>
    <a href="/monthly" class="sim-tab on" aria-current="page">📅 Monthly</a>
  </div>
  <nav class="mo-navbar" aria-label="Monthly plan">
    <div>
      <h1>Monthly plan</h1>
      <div class="mo-nav-sub">year board</div>
    </div>
    <label class="mo-year-lab">Year
      <input type="number" id="mo-year" min="2025" max="2035" step="1">
    </label>
  </nav>
</header>
<main>

<div class="card">
  <h2>Yearly matrix</h2>
  <textarea id="mo-yearly-paste" placeholder="Paste the matrix (WMT/day and NB_DT_ per month)…"></textarea>
  <div class="row" style="margin-top:6px">
    <button class="primary" onclick="moYearlyPaste()">Load and build year</button>
    <input type="file" id="mo-yearly-file" accept=".xlsx,.xlsm,.csv,.tsv,.txt">
    <button onclick="moYearlyUpload()">Upload</button>
    <span class="status" id="mo-yearly-status"></span>
  </div>
</div>

<div class="card" id="mo-scen-card">
  <h2>Scenarios</h2>
  <div class="row">
    <input type="file" id="mo-scen-file" accept=".xlsx,.xlsm">
    <button onclick="scenImport()">Import</button>
    <span class="status" id="mo-scen-status"></span>
  </div>
  <div class="mat-grid" id="mo-scen-summary" style="margin-top:12px"></div>
  <div style="overflow:auto;margin-top:8px"><table id="mo-scen-table"></table></div>
  <div class="chart" id="mo-scen-chart" style="margin-top:14px;height:340px"></div>
  <div id="mo-scen-detail" style="margin-top:8px"></div>
</div>

<div class="card" id="mo-board">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
    <h2 style="margin:0">Year board</h2>
    <div class="row" style="gap:8px;align-items:center">
      <label class="muted" style="font-size:12px">Scenario
        <select id="mo-board-scen" style="margin-left:6px">
          <!-- "Latest" used to mean latest saved FILE per month, which silently
               mixed scenarios (Sep-Dec resolved to day-04 = S4 inside a workbook
               labelled S1). The default is now an explicit scenario. -->
          <!-- Planning-team names 2026-08-26: 3.0=as-is mining, 3.1=+1 Mt BLB
               LIM Oct-Dec; .1=all leftovers HUAFEI/BSE, .2=half to POS 6 from
               October. Days 03/04/05/06 are the machine keys. -->
          <!-- The board opens on 3.0.1, the live planning family (owner,
               2026-08-27). S1 is the old day-01 baseline: its December
               plans predate the 1,281-DT refreeze and read SAP ~200% of
               the sales line, which looked like a dashboard fault. It is
               still selectable, just no longer the thing you land on. -->
          <option value="3" selected>3.0.1 (S3)</option>
          <option value="4">3.0.2 (S4)</option>
          <option value="5">3.1.1 (S5)</option>
          <option value="6">3.1.2 (S6)</option>
          <option value="1">S1 (old baseline)</option>
        </select>
      </label>
      <button type="button" class="primary" id="mo-export-year" onclick="moExportYear()">Download Excel</button>
    </div>
  </div>
  <p class="muted" id="mo-board-note" style="margin:0 0 8px"></p>
  <div class="kpis" id="mo-year-kpis"></div>
  <div class="mat-grid" id="mo-year-mats"></div>
  <div id="mo-park-box"></div>
  <div class="cards" id="mo-cards"></div>
  <div class="chart" id="mo-chart-year" style="margin-top:16px;height:400px"></div>
  <div class="charts2">
    <div class="chart" id="mo-chart-year-sap"></div>
    <div class="chart" id="mo-chart-year-tos"></div>
  </div>
  <div class="charts2">
    <div class="chart" id="mo-chart-year-ld"></div>
    <div class="chart" id="mo-chart-year-cov"></div>
  </div>
  <div style="overflow:auto;margin-top:12px"><table id="mo-year-table"></table></div>
</div>

<div class="card" id="mo-month-card" style="display:none">
  <h2 id="mo-month-title">Month</h2>
  <div class="kpis" id="mo-kpis"></div>
  <div class="mat-grid" id="mo-kpis-mat"></div>
  <div class="chart" id="mo-chart-oldnew" style="height:320px"></div>
  <div class="charts2">
    <div class="chart" id="mo-chart-mat"></div>
    <div class="chart" id="mo-chart-cov"></div>
  </div>
  <div class="chart" id="mo-chart-daily"></div>
  <details style="margin-top:12px"><summary class="muted" style="cursor:pointer">Daily table</summary>
    <div style="max-height:340px;overflow:auto;margin-top:8px"><table id="mo-table"></table></div>
  </details>
  <div id="mo-path-box" style="margin-top:12px"></div>
</div>

<details class="card adv">
  <summary>Advanced</summary>
  <div class="row" style="margin-top:10px">
    <label class="muted">Month <input type="month" id="mo-month" style="margin-left:6px"></label>
    <select id="mo-months" title="Stored months"><option value="">Stored…</option></select>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px">
    <div>
      <h2>Build from a save</h2>
      <div class="row">
        <select id="mo-saved"><option value="">Saved daily plans…</option></select>
        <button onclick="moBuild()">Build month</button>
        <span class="status" id="mo-build-status"></span>
      </div>
      <div id="mo-pred-summary" class="muted" style="margin-top:10px;font-size:12px"></div>
    </div>
    <div>
      <h2>Replace target</h2>
      <div class="row">
        <input type="file" id="mo-file" accept=".xlsx,.xlsm,.csv,.tsv,.txt">
        <button onclick="moUpload()">Upload</button>
        <span class="status" id="mo-man-status"></span>
      </div>
      <textarea id="mo-paste" placeholder="date, wmt"></textarea>
      <div class="row" style="margin-top:6px">
        <button onclick="moPaste()">Use pasted rows</button>
        <span class="muted" id="mo-man-summary" style="font-size:12px"></span>
      </div>
    </div>
  </div>
  <div id="mo-yearly-months" class="row" style="margin-top:12px"></div>
  <div id="mo-record-out" style="margin-top:10px"></div>
</details>

</main>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
let _state=null,_alloc=null,_charts={},_board=null,_selMonth='';

function year(){return String($('mo-year').value||new Date().getFullYear());}
function month(){return $('mo-month').value;}
function fmt(n){return n==null?'—':Number(n).toLocaleString('en-GB',{maximumFractionDigits:0});}
function fmt2(n){return n==null||!isFinite(n)?'—':Number(n).toLocaleString('en-GB',{maximumFractionDigits:2,minimumFractionDigits:0});}
function pct(n){return n==null?'—':n.toFixed(1)+'%';}
function pathRates(x){
  const dtB=x.dt_before, dtA=x.dt_after;
  const prB=x.pred_before, prA=x.pred_after;
  let trA=x.trips, trB=x.trips_before;
  if(trB==null&&trA&&prA)trB=prB!=null?prB*(trA/prA):null;
  return {
    tpdOld:dtB>0&&trB!=null?trB/dtB:null,
    tpdNew:dtA>0&&trA!=null?trA/dtA:null,
    wpdOld:dtB>0&&prB!=null?prB/dtB:null,
    wpdNew:dtA>0&&prA!=null?prA/dtA:null
  };
}
function pathRatesTotal(rows){
  let tgt=0,dtB=0,dtA=0,trB=0,trA=0,prB=0,prA=0;
  rows.forEach(x=>{
    const rt=pathRates(x);
    tgt+=x.target||0; dtB+=x.dt_before||0; dtA+=x.dt_after||0;
    prB+=x.pred_before||0; prA+=x.pred_after||0;
    if(rt.tpdOld!=null&&x.dt_before)trB+=rt.tpdOld*x.dt_before;
    if(rt.tpdNew!=null&&x.dt_after)trA+=rt.tpdNew*x.dt_after;
  });
  return '<tr><td><b>TOTAL</b></td><td colspan="3" class="muted">'+rows.length+' paths</td>'
    +'<td><b>'+fmt(tgt)+'</b></td><td><b>'+fmt(dtB)+'</b></td><td><b>'+fmt(dtA)+'</b></td>'
    +'<td>'+fmt2(dtB?trB/dtB:null)+'</td><td><b>'+fmt2(dtA?trA/dtA:null)+'</b></td>'
    +'<td>'+fmt2(dtB?prB/dtB:null)+'</td><td><b>'+fmt2(dtA?prA/dtA:null)+'</b></td>'
    +'<td>'+fmt(prB)+'</td><td><b>'+fmt(prA)+'</b> <span class="muted">'+pct(tgt?100*prA/tgt:null)+'</span></td></tr>';
}
// Two clocks (owner 2026-08-27): target and the predicted plan. The
// pre-allocate "old predicted" series left every chart with the headline.
const CLOCKS=[
  {name:'Target', color:'#eab308', dash:false, fill:0, hard:true},
  {name:'Predicted plan', color:'#ef4444', dash:false, fill:0.12},
];
function hexAlpha(hex,a){
  const n=parseInt(String(hex).replace('#',''),16);
  return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
function fmtAxis(v){
  if(v==null||!isFinite(v))return '';
  const n=Number(v);
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(n%1e6===0?0:1)+'M';
  return n.toLocaleString('en-GB',{maximumFractionDigits:0});
}
function clockLine(i, data, extra){
  const s=CLOCKS[i];
  extra=extra||{};
  const dashed=!!s.dash;
  const hard=!!s.hard;
  const showSym=hard?false:(extra.showSymbol!==undefined?extra.showSymbol:true);
  const opt={
    name:extra.name||s.name, type:'line', smooth:false, connectNulls:true,
    symbol:hard?'none':'circle', symbolSize:dashed?5:7,
    showSymbol:showSym,
    color:s.color, z:hard?8:(dashed?3:5),
    lineStyle:{
      width:hard?3.6:(dashed?1.8:2.8),
      type:dashed?'dashed':'solid',
      color:s.color, cap:'round', join:'round'
    },
    itemStyle:{color:s.color, borderColor:s.color, borderWidth:0},
    emphasis:{focus:'series', lineStyle:{width:hard?4.4:(dashed?2.4:3.4)}},
    data:data
  };
  if(s.fill)opt.areaStyle={color:hexAlpha(s.color,s.fill), origin:'start'};
  return opt;
}
function clockLines(getters, xs){
  const src=xs||[];
  return CLOCKS.map((s,i)=>clockLine(i, src.map(getters[i])));
}
function barClock(i, data){
  const s=CLOCKS[i];
  return {name:s.name, type:'bar', barMaxWidth:22, barGap:'20%',
    lineStyle:{type:s.dash?'dashed':'solid'},
    itemStyle:{color:s.dash?hexAlpha(s.color,0.42):s.color, borderRadius:[3,3,0,0]},
    data:data};
}
function covClass(n){
  if(n==null)return '';
  if(n>=100)return 'ok';
  if(n>=90)return 'warn';
  return 'er';
}
function kpi(v, cls, k){
  return '<div class="kpi"><div class="v '+(cls||'')+'">'+fmt(v)+'</div><div class="k">'+k+'</div></div>';
}
// DT TO PARK (owner, 2026-08-28): the year is the judged line, so we only
// remove LIM-LD's YEAR surplus. Freed trucks first move to longer SAP hauls
// (KM15->KM0, POS 12->KM0, which need more trucks for the same tonnes);
// whatever no haul can take is what we actually park.
function parkBox(a, cards){
  if(!a)return '';
  const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,ch=>(
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const rows=(a.months||[]);
  const byName={}; rows.forEach(r=>{byName[r.name]=r;});
  if(!a.freed){
    return '<div class="park-box"><h3>DT to park — to land the year on 100%</h3>'
      +'<div class="sub">LIM-LD year is '+a.cov_before+'% of its line, at or under it. '
      +'Nothing to park.</div></div>';
  }
  const body=(cards||[]).map(c=>{
    const r=byName[c.name]; const pool=c.dt||0;
    if(!r)return '<tr><td>'+esc(c.name)+'</td><td class="zero">0</td>'
      +'<td>'+fmt(pool)+'</td></tr>';
    return '<tr><td>'+esc(r.name)+'</td><td class="park">'+fmt(r.park)+'</td>'
      +'<td class="keep">'+fmt(pool-r.park)+'</td></tr>';
  }).join('');
  return '<div class="park-box">'
    +'<h3>DT to park — to land the year on 100%</h3>'
    +'<div class="sub">'
    +(a.flat_level
      ?('The fleet runs at <b>ONE LEVEL — '+fmt(a.flat_level)+' DT every month</b> — not a '
        +'different number each month. That is the peak they need to own, so no truck is '
        +'bought for a single month and left standing after it. LIM-LD was <b>'+a.cov_before
        +'%</b> of its year line; parking to this level lands the year on <b>'+a.cov_after+'%</b>.')
      :('LIM-LD runs <b>'+a.cov_before+'%</b> of its year line. Parking these trucks takes '
        +fmt(a.removed)+' t off LIM-LD and the year lands on <b>'+a.cov_after+'%</b>.'))
    +' Nothing is re-routed — the trucks simply stop, so SAP and LIM-TOS are untouched.</div>'
    +'<table><thead><tr><th>Month</th><th>PARKED</th><th>RUNNING</th></tr></thead>'
    +'<tbody>'+body
    +'<tr class="tot"><td>TOTAL</td><td class="park">'+fmt(a.park)+'</td>'
    +'<td class="keep">'+(a.flat_level?fmt(a.flat_level):'—')+'</td></tr>'
    +'</tbody></table>'
    +'<div class="verdict" style="color:var(--ok)">'
    +(a.flat_level
      ?('FLEET TO OWN: '+fmt(a.flat_level)+' DT, held every month. Park '+fmt(a.park)
        +' DT in total and the year\'s LIM-LD lands on '+a.cov_after+'%.')
      :('PARK '+fmt(a.park)+' DT and the year\'s LIM-LD lands on '+a.cov_after+'%.'))
    +'</div></div>';
}

function matCard(m, extraK){
  if(!m)return '';
  // LIM-LD year card: the headline is coverage vs the SALES target
  // (6,644,306 t, planning team 2026-08-26) when the API supplies it.
  // The saves' internal monthly-target sum stays visible under its own
  // label — two clocks, never merged.
  const sales=m.sales_target!=null;
  const cov=sales?m.cov_sales:m.cov_pred;
  const left=sales?m.left_sales:(m.left!=null?m.left:m.left_pred_month);
  const over=sales?m.over_sales:(m.over!=null?m.over:m.over_pred_month);
  const pred=m.pred_after!=null?m.pred_after:m.pred_after_month;
  const tgt=sales?m.sales_target:(m.target!=null?m.target:m.target_month);
  return '<div class="mat-card">'
    +'<h3>'+m.label+'</h3>'
    +'<div class="cov '+covClass(cov)+'">'+pct(cov)+'</div>'
    +'<div class="pair"><span>'+(sales?'Sales target':'Target')+'</span><b>'+fmt(tgt)+'</b></div>'
    +'<div class="pair"><span>Predicted plan</span><b>'+fmt(pred)+'</b></div>'
    +(cov!=null&&cov<100?'<div class="pair"><span>Leaving</span><b style="color:var(--er)">'+fmt(left)+'</b></div>':'')
    +(cov!=null&&cov>100?'<div class="pair"><span>Over target</span><b style="color:var(--ok)">'+fmt(over)+'</b></div>':'')
    +(m._wasCov!=null?'<div class="pair"><span>was, before adjustment</span>'
      +'<b style="color:var(--warn)">'+pct(m._wasCov)+'</b></div>':'')
    +'</div>';
}

function legendIcons(series){
  return (series||[]).filter(s=>s&&s.name).map(s=>{
    const dashed=s.lineStyle&&s.lineStyle.type==='dashed';
    return {
      name:s.name,
      icon:dashed?'path://M0 7h6v3H0zM10 7h6v3h-6z':'path://M0 7h18v3H0z'
    };
  });
}
function chart(id,opt){
  const el=$(id);if(!el)return;
  if(typeof echarts==='undefined'){el.innerHTML='<div class="muted" style="padding:20px">Charts unavailable.</div>';return;}
  let c=_charts[id];
  if(c&&(c.isDisposed()||c.getDom()!==el)){try{c.dispose();}catch(e){}c=null;}
  if(!c){c=echarts.init(el);_charts[id]=c;}
  if(opt.tooltip&&!opt.tooltip.axisPointer){
    opt.tooltip={...opt.tooltip, axisPointer:{type:'line',
      lineStyle:{color:'rgba(148,163,184,.35)',width:1}}};
  }
  if(opt.legend&&opt.legend.show!==false&&!opt.legend.data&&opt.series){
    opt.legend={...opt.legend, data:legendIcons(opt.series)};
  }
  c.setOption(opt,true);
}
window.addEventListener('resize',()=>Object.values(_charts).forEach(c=>{try{c.resize();}catch(e){}}));

function axisTheme(unit){
  return {
    axis:{type:'category',axisLabel:{color:'#94a3b8',fontSize:11,margin:10},
      axisLine:{lineStyle:{color:'#30363d'}},axisTick:{show:false}},
    yax:{type:'value',name:unit||'t / month',nameGap:10,
      nameTextStyle:{color:'#8b98a5',fontSize:11,align:'left',padding:[0,0,0,0]},
      axisLabel:{color:'#94a3b8',fontSize:11,formatter:fmtAxis,margin:8},
      splitLine:{lineStyle:{color:'rgba(148,163,184,.10)',type:'solid',width:1}},
      axisLine:{show:false},axisTick:{show:false},splitNumber:5},
    grid:{left:16,right:20,top:58,bottom:8,containLabel:true},
    legend:{top:8,left:'center',itemWidth:18,itemHeight:3,itemGap:18,
      textStyle:{color:'#94a3b8',fontSize:11}},
    title:{left:8,top:0,textStyle:{fontSize:13,color:'#e6edf3',fontWeight:600}},
    tooltip:{trigger:'axis',backgroundColor:'#161b22',borderColor:'#30363d',
      extraCssText:'box-shadow:0 8px 24px rgba(0,0,0,.35)',
      textStyle:{color:'#e6edf3',fontSize:12},

function renderBoard(){
  const b=_board||{};
  const cards=b.cards||[];
  const Y=b.alloc_year;
  const note=$('mo-board-note');
  const nAlloc=cards.filter(c=>c.has_alloc).length;
  if(!b.has_matrix&&!cards.length){
    note.textContent='';
  }else{
    note.textContent=(b.source?b.source:'')
      +(b.routes?(b.source?' · ':'')+b.routes+' routes':'')
      +(nAlloc?(b.source||b.routes?' · ':'')+nAlloc+' month'+(nAlloc===1?'':'s')+' allocated':'');
  }

  const tot={p:0,t:0,n:0};
  cards.forEach(c=>{
    if(c.pred_month!=null){tot.p+=c.pred_month;tot.n+=1;}
    if(c.target_month!=null)tot.t+=c.target_month;
  });
  let html='';
  if(Y){
    // One clock (owner 2026-08-27, matching the Excel): sales target,
    // predicted plan, coverage — no pre-allocate "old predicted" headline.
    const salesT=Y.sales_target||Y.target;
    const salesCov=Y.sales_target?Y.cov_sales:Y.cov_new_pred;
    html=kpi(salesT,'man','sales target · year t')
      +kpi(Y.new_pred,'newp','predicted plan · year t')
      +'<div class="kpi"><div class="v '+covClass(salesCov)+'">'+pct(salesCov)+'</div><div class="k">predicted / sales target</div></div>'
      +(salesT>(Y.new_pred||0)?kpi(salesT-Y.new_pred,'','leaving vs sales target'):'')
      +((Y.new_pred||0)>salesT?kpi(Y.new_pred-salesT,'gap','plan over sales target'):'');
  }else if(tot.n){
    html=kpi(tot.p,'pred','old predicted plan · year t')
      +kpi(tot.t||null,'man','target · year t');
  }
  $('mo-year-kpis').innerHTML=html;

  const mats=Y&&Y.materials||{};
  const together=Y?{
    label:'Together',
    cov_pred:Y.cov_new_pred,
    target:Y.target,
    // Owner 2026-08-27: the constant 17.0 Mt haulage sales total — the
    // number the board is judged against, same in both scenario families.
    sales_target:Y.sales_target,
    cov_sales:Y.cov_sales,
    left_sales:Y.left_sales,
    over_sales:Y.over_sales,
    pred_before:Y.old_pred,
    pred_after:Y.new_pred,
    left:Y.left_new_pred,
    over:Y.over_new_pred
  }:null;
  // LIM-LD headlines the ADJUSTED coverage so the board reads ~100% across
  // all three materials (owner, 2026-08-28); the raw figure stays visible as
  // "was", and the panel below shows exactly which trucks got it there.
  const _adj=b.ld_adjust;
  const ldCard=(mats.ld&&_adj&&_adj.freed)
    ?Object.assign({},mats.ld,{cov_sales:_adj.cov_after,cov_pred:_adj.cov_after,
        _wasCov:_adj.cov_before,
        pred_after:(mats.ld.pred_after||0)-(_adj.removed||0),
        over_sales:0,left_sales:0,over:0,left:0})
    :mats.ld;
  $('mo-year-mats').innerHTML=Y
    ?(matCard(together,'year')+matCard(mats.sap,'year')+matCard(mats.tos,'year')+matCard(ldCard,'year'))
    :'';
  $('mo-park-box').innerHTML=parkBox(b.ld_adjust,cards);

  const max=Math.max(1,...cards.map(c=>{
    const a=c.alloc||{};
    return Math.max(c.pred_month||0,c.target_month||0,
      a.new_pred_month||0,a.old_pred_month||0,a.target_month||0);
  }));
  $('mo-cards').innerHTML=cards.map(c=>{
    const on=_selMonth===c.month?' on':'';
    const a=c.alloc;
    const h=v=>Math.max(6,Math.round(40*(v||0)/max));
    const pill=(lab,v)=>'<span class="pill '+covClass(v)+'">'+lab+' '+pct(v)+'</span>';
    if(a){
      return '<button type="button" class="mcard'+on+'" onclick="moPickMonth(\''+c.month+'\')">'
        +'<div class="name">'+c.name+' '+year()+'</div>'
        +'<div class="meta">'+(c.n_days||'—')+' days'
        +(a.dt_after!=null?' · '+fmt(a.dt_after)+' DT':'')
        +(a.source_date?' · from '+a.source_date:'')
        +'</div>'
        +'<div class="row3">'
        +'<div class="ln tgt"><span>Target</span><b>'+fmt(a.target_month)+'</b></div>'
        +'<div class="ln pred"><span>Predicted plan</span><b>'+fmt(a.new_pred_month)+'</b></div>'
        +'</div>'
        +'<div class="covs">'+pill('All',a.cov_new_pred)
          +pill('SAP',(a.materials.sap||{}).cov_pred)
          +pill('TOS',(a.materials.tos||{}).cov_pred)
          +pill('LD',(a.materials.ld||{}).cov_pred)
        +'</div>'
        +'<div class="bars" aria-hidden="true">'
          +'<i class="t" style="height:'+h(a.target_month)+'px"></i>'
          +'<i class="np" style="height:'+h(a.new_pred_month)+'px"></i>'
        +'</div></button>';
    }
    return '<button type="button" class="mcard'+on+'" onclick="moPickMonth(\''+c.month+'\')">'
      +'<div class="name">'+c.name+' '+year()+'</div>'
      +'<div class="meta">'+(c.n_days||'—')+' days'
      +(c.dt!=null?' · '+fmt(c.dt)+' DT':'')
      +(c.built?'':' · matrix only')+'</div>'
      +'<div class="row3">'
      +'<div class="ln tgt"><span>Target</span><b>'+fmt(c.target_month)+'</b></div>'
      +'<div class="ln pred"><span>Predicted plan</span><b>'+fmt(c.pred_month)+'</b></div>'
      +'</div>'
      +(c.built?('<div class="bars" aria-hidden="true"><i class="t" style="height:'+h(c.target_month)+'px"></i>'
        +'<i class="p" style="height:'+h(c.pred_month)+'px"></i></div>'):'')
      +'</button>';
  }).join('')||'<div class="muted">No months yet.</div>';

  const th=axisTheme('t / month');
  const labs=cards.map(c=>c.name);
  const hasA=cards.some(c=>c.alloc);
  function clock(key, fallback){
    return c=>{
      const a=c.alloc;
      if(a&&a[key]!=null)return a[key];
      return fallback?c[fallback]??null:null;
    };
  }
  function matClock(mat, field){
    return c=>{
      const m=c.alloc&&c.alloc.materials&&c.alloc.materials[mat];
      return m?m[field]??null:null;
    };
  }
  function threeLinesLocal(getters){
    return clockLines(getters, cards);
  }
  chart('mo-chart-year',{
    color:CLOCKS.map(s=>s.color),
    title:{...th.title,text:'Together · year'},
    legend:th.legend,grid:th.grid,tooltip:th.tooltip,
    xAxis:{...th.axis,data:labs},yAxis:th.yax,
    series:hasA
      ?threeLinesLocal([clock('target_month','target_month'),
                  clock('new_pred_month','pred_month')])
      :[
        clockLine(0, cards.map(c=>c.target_month??null)),
        clockLine(1, cards.map(c=>c.pred_month??null)),
      ]});

  function matLine(id, title, mat){
    chart(id,{
      color:CLOCKS.map(s=>s.color),
      title:{...th.title,text:title},
      legend:th.legend,grid:th.grid,tooltip:th.tooltip,
      xAxis:{...th.axis,data:labs},yAxis:th.yax,
      series:clockLines([
        matClock(mat,'target_month'),
        matClock(mat,'pred_after_month'),
      ], cards)
    });
  }
  matLine('mo-chart-year-sap','SAP · year','sap');
  matLine('mo-chart-year-tos','LIM-TOS · year','tos');
  matLine('mo-chart-year-ld','LIM-LD · year','ld');

  const thPct=axisTheme('%');
  chart('mo-chart-year-cov',{
    title:{...thPct.title,text:'Coverage · optimized predicted plan ÷ target'},
    legend:thPct.legend,grid:{...thPct.grid,left:56},
    tooltip:{...thPct.tooltip,valueFormatter:v=>v==null?'—':Number(v).toFixed(1)+'%'},
    xAxis:{...thPct.axis,data:labs},
    yAxis:{...thPct.yax,name:'%',min:0,max:val=>Math.max(120,Math.ceil((val.max||100)/10)*10),
      axisLabel:{color:'#94a3b8',fontSize:11,formatter:v=>v+'%'}},
    series:[
      {name:'All',type:'bar',barMaxWidth:18,itemStyle:{color:hexAlpha('#ef4444',0.55),borderRadius:[3,3,0,0]},
        data:cards.map(c=>c.alloc?c.alloc.cov_new_pred:null),
        markLine:{silent:true,symbol:'none',
          data:[{yAxis:100,label:{formatter:'100%',color:'#eab308',fontSize:11,fontWeight:600},
            lineStyle:{color:'#eab308',type:'solid',width:2.2}}]}},
      {name:'SAP',type:'line',symbol:'circle',symbolSize:6,color:'#eab308',
        lineStyle:{width:2.6,color:'#eab308',cap:'round'},
        data:cards.map(c=>c.alloc&&c.alloc.materials.sap?c.alloc.materials.sap.cov_pred:null)},
      {name:'LIM-TOS',type:'line',symbol:'circle',symbolSize:6,color:'#f97316',
        lineStyle:{width:2.4,color:'#f97316',cap:'round'},
        data:cards.map(c=>c.alloc&&c.alloc.materials.tos?c.alloc.materials.tos.cov_pred:null)},
      {name:'LIM-LD',type:'line',symbol:'circle',symbolSize:6,color:'#94a3b8',
        lineStyle:{width:2.2,type:'solid',color:'#94a3b8',cap:'round'},
        data:cards.map(c=>c.alloc&&c.alloc.materials.ld?c.alloc.materials.ld.cov_pred:null)},
    ]});

  $('mo-year-table').innerHTML=cards.length
    ?('<tr><th>Month</th><th>Target</th><th>Predicted plan</th><th>Predicted %</th>'
      +'<th>SAP %</th><th>LIM-TOS %</th><th>LIM-LD %</th><th>Leaving</th></tr>'
      +cards.map(c=>{
        const a=c.alloc;
        if(!a){
          return '<tr><td>'+c.name+'</td><td>'+fmt(c.target_month)+'</td><td>'+fmt(c.pred_month)+'</td>'
            +'<td>—</td><td>—</td>'
            +'<td colspan="4" class="muted">no Allocate snapshot</td></tr>';
        }
        return '<tr><td>'+c.name+(a.source_date?' <span class="muted">'+a.source_date+'</span>':'')+'</td>'
          +'<td>'+fmt(a.target_month)+'</td><td><b>'+fmt(a.new_pred_month)+'</b></td>'
          +'<td>'+pct(a.cov_new_pred)+'</td>'
          +'<td>'+pct((a.materials.sap||{}).cov_pred)+'</td>'
          +'<td>'+pct((a.materials.tos||{}).cov_pred)+'</td>'
          +'<td>'+pct((a.materials.ld||{}).cov_pred)+'</td>'
          +'<td>'+fmt(a.left_new_pred_month)+'</td></tr>';
      }).join('')
      +(Y?('<tr><td><b>TOTAL · '+Y.n+' months</b></td><td><b>'+fmt(Y.target)+'</b></td>'
        +'<td><b>'+fmt(Y.new_pred)+'</b></td>'
        +'<td><b>'+pct(Y.cov_new_pred)+'</b></td>'
        +'<td><b>'+pct((mats.sap||{}).cov_pred)+'</b></td>'
        +'<td><b>'+pct((mats.tos||{}).cov_pred)+'</b></td>'
        +'<td><b>'+pct((mats.ld||{}).cov_pred)+'</b></td>'
        +'<td><b>'+fmt(Y.left_new_pred)+'</b></td></tr>'):''))
    :'';
}

function renderMonth(){
  const st=_state||{};
  const p=st.prediction,m=st.manual;
  const a=_alloc;
  const card=$('mo-month-card');
  $('mo-pred-summary').innerHTML=p
    ?('Built from <b>'+(p.source_date||'')+'</b> · predicted '+fmt(p.per_day_wmt)+' t/day'
      +' · '+fmt(p.dt)+' DT'
      +'<br>'+(p.paths||[]).map(x=>x.key+' ('+x.contractor+', '+x.dt+' DT'
        +(x.material?', '+x.material:'')+')').join(' · '))
    :(a?'Allocate snapshot from <b>'+(a.source_date||'')+'</b> · '+fmt(a.dt_after)+' DT. Matrix month file not required.'
      :'No prediction month built yet.');
  $('mo-man-summary').textContent=m?('Loaded '+(m.days||[]).length+' days from '+(m.source||'?')):'';
  if(!p&&!m&&!a){card.style.display='none';return;}
  card.style.display='';
  const label=_selMonth||month()||'Month';
  $('mo-month-title').textContent=label+(a?' · old predicted plan vs optimized predicted plan':' · same day, every day')
    +(a&&a.source_date?' · saved '+a.source_date:'');

  const M=(a&&a.materials)||{};
  const days={};
  (p&&p.days||[]).forEach(d=>{
    const r=(days[d.date]=days[d.date]||{});
    r.p=d.wmt;
  });
  (m&&m.days||[]).forEach(d=>{(days[d.date]=days[d.date]||{}).t=d.wmt;});
  if(a){
    const dates=Object.keys(days).length?Object.keys(days).sort()
      :(function(){
        const y=label.slice(0,4), mo=label.slice(5,7);
        const last=new Date(Number(y), Number(mo), 0).getDate();
        const out=[];
        for(let d=1;d<=last;d++)out.push(label+'-'+String(d).padStart(2,'0'));
        return out;
      })();
    dates.forEach(d=>{
      const r=(days[d]=days[d]||{});
      r.op=a.old_pred_day; r.np=a.new_pred_day;
      if(r.t==null)r.t=a.target_day;
    });
  }
  const ds=Object.keys(days).sort();
  const totP=(p&&p.days||[]).reduce((s,d)=>s+(d.wmt||0),0);
  const totT=(m&&m.days||[]).reduce((s,d)=>s+(d.wmt||0),0);

  if(a){
    $('mo-kpis').innerHTML=
      kpi(a.target_month,'man','target · month t')
      +kpi(a.new_pred_month,'newp','predicted plan')
      +'<div class="kpi"><div class="v '+covClass(a.cov_new_pred)+'">'+pct(a.cov_new_pred)+'</div><div class="k">predicted / target</div></div>'
      +(a.left_new_pred_month?kpi(a.left_new_pred_month,'','leaving vs target'):'')
      +(a.over_new_pred_month?kpi(a.over_new_pred_month,'gap','over target'):'')
      +kpi(a.dt_after,'','DT after · '+fmt(a.dt_before)+' before');
    const tog={label:'Together',cov_pred:a.cov_new_pred,target:a.target_month,
      pred_before:a.old_pred_month,pred_after:a.new_pred_month,
      left:a.left_new_pred_month,over:a.over_new_pred_month};
    $('mo-kpis-mat').innerHTML=matCard(tog,'month')+matCard(M.sap,'month')+matCard(M.tos,'month')+matCard(M.ld,'month');
  }else{
    $('mo-kpis').innerHTML=
      kpi(totP||null,'pred','predicted plan · month t')
      +kpi(totT||null,'man','target · month t')
      +(p&&m?kpi(totP-totT,'gap','predicted − target'):'');
    $('mo-kpis-mat').innerHTML='';
  }

  const th=axisTheme('t / day');
  if(a){
    const cats=['Target','Predicted plan'];
    const vals=[a.target_day,a.new_pred_day];
    chart('mo-chart-oldnew',{
      title:{...th.title,text:'Day clocks · month = day × '+ds.length+' days'},
      legend:{show:false},grid:{...th.grid,top:42},tooltip:th.tooltip,
      xAxis:{...th.axis,data:cats},yAxis:th.yax,
      series:[{type:'bar',barMaxWidth:44,
        data:vals.map((v,i)=>({value:v,itemStyle:{color:CLOCKS[i].dash?hexAlpha(CLOCKS[i].color,0.42):CLOCKS[i].color,borderRadius:[3,3,0,0]}}))}]
    });
    const mLabs=['SAP','LIM-TOS','LIM-LD'];
    const mk=['sap','tos','ld'];
    chart('mo-chart-mat',{
      color:CLOCKS.map(s=>s.color),
      title:{...th.title,text:'Materials · t / day'},
      legend:th.legend,grid:th.grid,tooltip:th.tooltip,
      xAxis:{...th.axis,data:mLabs},yAxis:th.yax,
      series:[
        barClock(0, mk.map(k=>(M[k]||{}).target_day)),
        barClock(1, mk.map(k=>(M[k]||{}).pred_after_day)),
      ]
    });
    const covs=[{lab:'All',v:a.cov_new_pred},{lab:'SAP',v:(M.sap||{}).cov_pred},
      {lab:'LIM-TOS',v:(M.tos||{}).cov_pred},{lab:'LIM-LD',v:(M.ld||{}).cov_pred}];
    const thPct=axisTheme('%');
    chart('mo-chart-cov',{
      title:{...thPct.title,text:'Moving vs leaving · optimized predicted plan / target'},
      legend:{show:false},grid:{...thPct.grid,left:56},
      tooltip:{...thPct.tooltip,valueFormatter:v=>v==null?'—':Number(v).toFixed(1)+'%'},
      xAxis:{...thPct.axis,data:covs.map(x=>x.lab)},
      yAxis:{...thPct.yax,name:'%',min:0,max:val=>Math.max(120,Math.ceil((val.max||100)/10)*10),
        axisLabel:{color:'#94a3b8',fontSize:11,formatter:v=>v+'%'}},
      series:[{type:'bar',barMaxWidth:36,
        data:covs.map(x=>({value:x.v,itemStyle:{color:covClass(x.v)==='ok'?hexAlpha('#22c55e',0.85):(covClass(x.v)==='warn'?'#facc15':'#ef4444'),borderRadius:[3,3,0,0]}})),
        markLine:{silent:true,symbol:'none',
          data:[{yAxis:100,label:{formatter:'100%',color:'#eab308',fontSize:11,fontWeight:600},
            lineStyle:{color:'#eab308',type:'solid',width:2.2}}]}}]
    });
  }else{
    chart('mo-chart-oldnew',{title:{...th.title,text:'Save Allocate DT on the Plan tab to see old vs new'},series:[]});
    chart('mo-chart-mat',{series:[]});
    chart('mo-chart-cov',{series:[]});
  }

  const lab=ds.map(d=>d.slice(8));
  chart('mo-chart-daily',{
    color:CLOCKS.map(s=>s.color),
    title:{...th.title,text:'Daily WMT (flat — the same plan every day)'},
    legend:th.legend,grid:th.grid,tooltip:th.tooltip,

      +'<tr><td><b>Total</b></td><td><b>'+fmt(totP||null)+'</b></td><td><b>'+fmt(totT||null)+'</b></td></tr>';
  }

  let box='';
  if(a&&(a.rows||[]).length){
    const rows=(a.rows||[]).slice().sort((x,y)=>(x.prio||9)-(y.prio||9));

      +'<th>WMT/DT old</th><th>WMT/DT new</th>'
      +'<th>Pred old</th><th>Pred new</th></tr>'
      +rows.map(x=>{

        const rt=pathRates(x);
        return '<tr><td>P'+(x.prio||'')+'</td><td>'+(x.key||'')+'</td><td>'+(x.contractor||'')+'</td>'
          +'<td>'+(x.material||'')+(x.otype?' · '+x.otype:'')+'</td>'
          +'<td>'+fmt(x.target)+'</td>'
          +'<td>'+fmt(x.dt_before)+'</td>'
          +'<td><b>'+fmt(x.dt_after)+'</b>'+(d?' <span style="color:'+(d>0?'var(--ok)':'var(--warn)')+'">('+(d>0?'+':'')+d+')</span>':'')+'</td>'
          +'<td>'+fmt2(rt.tpdOld)+'</td><td><b>'+fmt2(rt.tpdNew)+'</b></td>'
          +'<td>'+fmt2(rt.wpdOld)+'</td><td><b>'+fmt2(rt.wpdNew)+'</b></td>'
          +'<td>'+fmt(x.pred_before)+'</td><td><b>'+fmt(x.pred_after)+'</b></td></tr>';
      }).join('')
      +pathRatesTotal(rows)
      +'</table>'
      +'<div class="sec-label">Materials · t / day</div>'
      +'<table><tr><th></th><th>SAP</th><th>LIM-TOS</th><th>LIM-LD</th><th>Together</th></tr>'
      +[['Target',k=>bkt(k).target_day,a.target_day],
        ['Predicted plan',k=>bkt(k).pred_after_day,a.new_pred_day],
        ['Predicted %',k=>bkt(k).cov_pred,a.cov_new_pred]].map(row=>{
          const [lab,fn,tot]=row;
          const isPct=lab.indexOf('%')>=0;
          const cell=v=>isPct?pct(v):fmt(v);
          return '<tr><td>'+lab+'</td><td>'+cell(fn('sap'))+'</td><td>'+cell(fn('tos'))+'</td>'
            +'<td>'+cell(fn('ld'))+'</td><td><b>'+cell(tot)+'</b></td></tr>';
        }).join('')
      +'</table>';
    const moves=a.moves||[];
    const moved=a.moved_total!=null?a.moved_total:moves.reduce((s,x)=>s+(x.trucks||0),0);
    if(moves.length){
      box+='<div class="sec-label">DT moves ('+fmt(moved)+')</div>'
        +moves.map(x=>'<div style="font-size:12px;margin-top:2px">· '+(x.contractor||'')+' '+(x.trucks||0)+' DT: '
          +(x.from||'')+' → '+(x.to||'')+' <span class="muted">('
          +(x.tag||x.reason||'')+(x.same_origin?' · same origin':' · cross plan')+')</span></div>').join('');
    }
  }else if(paths.length){
    box='<table><tr><th>Path</th><th>Contractor</th><th>Material</th><th>DT</th><th>Predicted t/day</th><th>Target t/day</th></tr>'
      +paths.map(x=>'<tr><td>'+x.key+'</td><td>'+(x.contractor||'')+'</td><td>'+(x.material||'—')+'</td>'

      +'</table>';
  }

}

let _moExportBusy=false;
async function moExportYear(){
  // fetch -> blob keeps the page alive and is single-flight. The old
  // window.location= left the PAGE pending for the whole build, so a second
  // click aborted the first — "the other scenarios never download".
  // A timeout/proxy HTML page used to be saved as .xlsx; Excel then said
  // "file format is not valid". Refuse anything that is not a zip (PK).
  if(_moExportBusy)return;
  const btn=$('mo-export-year');
  const orig=btn?btn.textContent:'Download Excel';
  _moExportBusy=true;
  if(btn){btn.disabled=true;btn.textContent='Building Excel…';}
  try{
    const r=await fetch('/api/monthly/export-year?year='+year()+boardDay());
    const buf=await r.arrayBuffer();
    const u8=new Uint8Array(buf);
    const isXlsx=u8.length>4 && u8[0]===0x50 && u8[1]===0x4B; // PK
    if(!r.ok || !isXlsx){
      let msg='HTTP '+r.status;
      try{
        const t=new TextDecoder().decode(u8.slice(0,800)).replace(/\s+/g,' ').trim();
        if(t) msg=t.slice(0,280);
      }catch(_){}
      throw new Error(msg);
    }
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    let name='monthly_plan_'+year()+'.xlsx';
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename\*?=(?:UTF-8''|"?)([^";]+)/i);
    if(m){
      try{name=decodeURIComponent(m[1].replace(/"/g,'').trim());}catch(_){name=m[1].trim();}
    }
    if(!/\.xlsx$/i.test(name)) name+='.xlsx';
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),10_000);
    if(btn)btn.textContent='Downloaded ✓';
  }catch(e){
    if(btn)btn.textContent='Export failed — retry';
    alert('Excel export failed: '+(e&&e.message?e.message:e));
  }finally{
    _moExportBusy=false;
    if(btn){btn.disabled=false;setTimeout(()=>{if(btn.textContent!=='Download Excel')btn.textContent=orig;},2500);}
  }
}

  const scs=r.scenarios, cap=r.ld_cap;
  // Per-scenario LD target (owner 2026-08-27): the total haulage line is
  // constant at 17.0 Mt, so 3.0 carries the ~1 Mt the LIM-TOS did not take
  // (LD 7,634,306) while 3.1 carries 6,644,306. Each scenario's own ld_cap
  // labels its card; the chart line uses the fleet-wide r.ld_cap only as a
  // fallback.
  const capMt=cap?(cap/1e6).toFixed(2).replace(/\.00$/,'')+' Mt':'target';
  // summary cards: one per scenario, LD attainment front and centre
  $('mo-scen-summary').innerHTML=scs.map(s=>{
    const t=s.total, scap=t.ld_cap||cap;
    const scapMt=scap?(scap/1e6).toFixed(2).replace(/\.00$/,'')+' Mt':'target';
    const pct=scap?Math.round(100*t.ld_t_planned/scap):null;
    const cls=t.ld_cap_reached?'ok':(pct>=85?'warn':'er');
    return `<div class="mat-card"><h3>${s.label}</h3>
      <div class="cov ${cls}">${pct==null?'—':pct+'%'}</div>
      <div class="pair"><span>LIM-LD vs ${scapMt} target</span><b>${MFMT(t.ld_t_planned)} t</b></div>
      <div class="pair"><span>uncapped capacity</span><b>${MFMT(t.ld_t_capacity)} t</b></div>
      <div class="pair"><span>SAP moved</span><b>${MFMT(t.sap_t)} t</b></div>
      <div class="pair"><span>LIM-TOS moved</span><b>${MFMT(t.limtos_t)} t</b></div>
      ${t.ld_cap_reached?`<div class="pair"><span style="color:var(--ok)">${scapMt} target met — ${MFMT(t.ld_over_target_t||0)} t over</span></div>`:
        `<div class="pair"><span style="color:var(--er)">short of the target by</span><b>${MFMT(t.ld_shortfall_t)} t</b></div>`}
      ${s.violations&&s.violations.length?`<div class="pair"><span style="color:var(--er)">BLB≠RIM: ${s.violations.length}</span></div>`:''}
    </div>`;}).join('');
  // month table: DT split per priority for every scenario side by side
  let h='<tr><th>Month</th><th>Fleet (RIM+SMA)</th>'+scs.map(s=>`<th colspan="4">${s.label}<br><span class="muted" style="font-weight:400">P1 SAP · P2 LIM-TOS · P3 free DT · LIM-LD t</span></th>`).join('')+'</tr>';
  const months=scs[0].months.map(m=>m.month);
  months.forEach((mn,i)=>{
    const pool=scs[0].months[i].pool;
    h+=`<tr><td>${MONN[mn]||mn}</td><td>${MFMT((pool.RIM||0)+(pool.SMA||0))} <span class="muted">(${MFMT(pool.RIM||0)}+${MFMT(pool.SMA||0)})</span></td>`;
    scs.forEach(s=>{const mo=s.months[i]||{};
      h+=`<td>${MFMT(Math.round(mo.dt_p1))}</td><td>${MFMT(Math.round(mo.dt_p2))}</td><td><b>${MFMT(Math.round(mo.dt_p3))}</b></td><td>${MFMT(mo.ld_t_month_planned)}${mo.ld_capped?' <span class="pill ok">cap</span>':''}</td>`;});
    h+='</tr>';});
  h+='<tr style="font-weight:700"><td>Total</td><td></td>'+scs.map(s=>`<td></td><td></td><td></td><td>${MFMT(s.total.ld_t_planned)}</td>`).join('')+'</tr>';
  $('mo-scen-table').innerHTML=h;
  // chart: monthly LIM-LD per scenario + cumulative vs cap
  if(window.echarts){
    const el=$('mo-scen-chart'); const ch=echarts.init(el,'dark');
    const cums=scs.map(s=>{let c=0;return s.months.map(m=>Math.round(c+=m.ld_t_month_planned));});
    ch.setOption({backgroundColor:'transparent',
      title:{text:'LIM-LD (Tofu dump → Huafei) by scenario',textStyle:{fontSize:13}},
      tooltip:{trigger:'axis'},legend:{top:24},
      grid:{top:60,left:70,right:70,bottom:30},
      xAxis:{type:'category',data:months.map(m=>MONN[m]||m)},
      yAxis:[{type:'value',name:'t / month'},{type:'value',name:'cumulative t',max:Math.max(cap*1.05,...cums.flat())}],
      series:[...scs.map((s,i)=>({name:s.label,type:'bar',data:s.months.map(m=>m.ld_t_month_planned)})),
              ...scs.map((s,i)=>({name:s.label+' cumulative',type:'line',yAxisIndex:1,data:cums[i],symbolSize:5})),
              {name:capMt+' target',type:'line',yAxisIndex:1,data:months.map(()=>cap),lineStyle:{type:'dashed',color:'#ef4444'},symbol:'none'}]});
  }
  // per-scenario allocation detail (collapsible)
  $('mo-scen-detail').innerHTML=scs.map(s=>{
    let rows='';
    s.months.forEach(mo=>{
      (mo.rows||[]).forEach(a=>{rows+=`<tr><td>${MONN[mo.month]}</td><td>P${a.prio}</td><td>${a.pit}</td><td>${a.mat}${a.otype&&a.otype!=='TOS'?'-'+a.otype:''}</td><td>${a.dest}</td><td>${a.contractor}</td><td>${MFMT(a.wmt_day)}</td><td>${a.dt}</td><td>${MFMT(a.rate_t_dt_day)}</td></tr>`;});
      rows+=`<tr style="color:var(--muted)"><td>${MONN[mo.month]}</td><td>P3</td><td>TOFU</td><td>LIM-LD</td><td>HUAFEI</td><td>${Object.entries(mo.free).map(([c,v])=>c+' '+Math.round(v)).join(' + ')}</td><td>${MFMT(mo.ld_t_day_capacity)}</td><td><b>${Math.round(mo.dt_p3)}</b></td><td></td></tr>`;
      (mo.lends||[]).forEach(l=>{rows+=`<tr style="color:#60a5fa"><td>${MONN[mo.month]}</td><td colspan="8">↔ ${l.dt} DT: ${l.note}</td></tr>`;});
      (mo.deficit||[]).forEach(d=>{rows+=`<tr style="color:var(--er)"><td>${MONN[mo.month]}</td><td colspan="8">⚠ ${d.pit} ${d.mat}: ${d.why}${d.wmt_day?' ('+MFMT(d.wmt_day)+' t/day)':''}</td></tr>`;});
    });
    return `<details style="margin-top:6px"><summary class="muted" style="cursor:pointer">${s.label} — full DT allocation${s.months_filled_from_s1.length?' · '+s.months_filled_from_s1.map(m=>MONN[m]).join(', ')+' taken from S1':''}</summary>
      <div style="max-height:420px;overflow:auto;margin-top:8px"><table>
      <tr><th>Month</th><th>Prio</th><th>Pit</th><th>Material</th><th>Destination</th><th>Contractor</th><th>t/day</th><th>DT</th><th>t/DT/day</th></tr>${rows}</table></div></details>`;
  }).join('');
}
scenRefresh();
</script>
</body>
</html>
